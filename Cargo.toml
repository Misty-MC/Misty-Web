[package]
name = "misty-site"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
hmac = "0.12"
include_dir = "0.7.4"
maud = { version = "0.27.0", features = ["axum"] }
pulldown-cmark = "0.13.6"
rand = "0.9"
# TLS : rustls avec ring (installé au démarrage, voir main.rs) plutôt qu'aws-lc, long à compiler (C)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.2.0"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header"] }

[profile.release]
# Binaire plus petit (image Docker plus légère), sans changer la vitesse
strip = true
