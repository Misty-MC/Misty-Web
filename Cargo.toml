[package]
name = "misty-site"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
include_dir = "0.7.4"
maud = { version = "0.27.0", features = ["axum"] }
pulldown-cmark = "0.13.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header"] }
