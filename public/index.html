<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misty – Launcher Minecraft</title>
<meta name="description" content="Misty, un launcher Minecraft léger écrit en Rust : profils, mods Modrinth et CurseForge, modpacks, tous les mod loaders.">
<link rel="icon" href="/assets/icone.png">
<style>
@font-face{font-family:Silkscreen;src:url(/assets/Silkscreen-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Silkscreen;src:url(/assets/Silkscreen-Bold.ttf);font-weight:700;font-display:swap}
:root{
  --navy:#1c2335;--ink:#1c2335;--muted:#44526b;
  --glass:rgba(255,255,255,.45);--glass-strong:rgba(255,255,255,.7);--edge:rgba(255,255,255,.65);
  --shadow:0 12px 40px rgba(28,35,53,.25);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#1c2335 #ffffff40}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,#bad6f7 0%,#95b9e4 45%,#5b7fb0 100%) fixed;
  overflow-x:hidden;line-height:1.6;
}

/* Sélection de texte */
::selection{background:#1c2335;color:#fff;text-shadow:none}
::-moz-selection{background:#1c2335;color:#fff;text-shadow:none}

/* Scrollbar */
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:#ffffff40;border-left:1px solid #ffffff66}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#2a3550,#1c2335);
  border-radius:999px;border:3px solid transparent;background-clip:padding-box;
}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#3a4a70,#273250);background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}

.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(10px)}
.orb.a{width:620px;height:620px;left:-180px;top:-160px;background:radial-gradient(circle,#e4f1ff99,#e4f1ff00 65%)}
.orb.b{width:700px;height:700px;right:-220px;bottom:-240px;background:radial-gradient(circle,#3f4a5eaa,#3f4a5e00 62%)}
main,header,footer{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.pix{font-family:Silkscreen,monospace;letter-spacing:.02em}
.glass{
  background:var(--glass);border:1px solid var(--edge);border-radius:22px;
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:var(--shadow);
}

/* Navigation */
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;color:var(--navy);text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px}
.navright{display:flex;align-items:center;gap:10px}
.navlinks{display:flex;gap:4px;padding:6px;border-radius:999px}
.navlinks a{color:var(--navy);text-decoration:none;font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;transition:.2s}
.navlinks a:hover{background:#ffffff80}

/* Sélecteur de langue */
.lang{display:flex;gap:2px;padding:5px;border-radius:999px}
.lang button{
  font-family:Silkscreen,monospace;font-size:11px;color:var(--navy);background:transparent;border:0;cursor:pointer;
  padding:8px 11px;border-radius:999px;transition:.2s;letter-spacing:.04em
}
.lang button:hover{background:#ffffff80}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.lang button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

.btn{
  display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;font-size:16px;
  padding:16px 28px;border-radius:16px;transition:transform .15s,box-shadow .15s,background .15s;cursor:pointer;border:0;
}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.75}
.btn.primary{background:var(--navy);color:#fff;box-shadow:0 8px 24px rgba(28,35,53,.4)}
.btn.primary:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(28,35,53,.45)}
.btn.ghost{background:var(--glass-strong);color:var(--navy);border:1px solid var(--edge)}
.btn.ghost:hover{transform:translateY(-3px);background:#fff}
.btn.sm{padding:10px 20px;font-size:14px;border-radius:999px}
.btn svg{width:22px;height:22px;flex:none}

/* Hero */
.hero{text-align:center;padding:56px 0 24px}
.hero h1{font-size:clamp(46px,9vw,96px);color:var(--navy);line-height:1;text-shadow:0 4px 0 #ffffff80}
.hero p.sub{max-width:660px;margin:18px auto 0;font-size:clamp(17px,2vw,21px);color:var(--muted)}
.badge{display:inline-block;margin-top:22px;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--navy);background:#ffffff99;border:1px solid var(--edge)}
.badge i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1bd96a;margin-right:8px;box-shadow:0 0 8px #1bd96a}
.cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.shot{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 24px 60px rgba(28,35,53,.35);border:1px solid var(--edge)}
.hero .shot{margin-top:48px}

/* Sections */
section{padding:56px 0}
h2{font-size:clamp(22px,4vw,34px);color:var(--navy);margin-bottom:12px}
.center{text-align:center}
.lead{max-width:640px;margin:0 auto 34px;color:var(--muted);font-size:17px}

.feature{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(24px,5vw,56px);align-items:center;padding:36px 0}
.feature.rev{grid-template-columns:1.25fr 1fr}
.feature.rev .txt{order:2}
.feature .txt h3{font-family:Silkscreen,monospace;font-size:clamp(18px,2.4vw,24px);color:var(--navy);margin-bottom:12px}
.feature .txt p{color:var(--muted);font-size:17px}
.feature .txt ul{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.feature .txt li{font-family:Silkscreen,monospace;font-size:11px;padding:6px 12px;border-radius:999px;background:#ffffff99;border:1px solid var(--edge);color:var(--navy)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{padding:26px;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card .ico{font-size:28px;margin-bottom:8px}
.card h3{font-family:Silkscreen,monospace;font-size:15px;color:var(--navy);margin-bottom:6px}
.card p{font-size:15px;color:var(--muted)}

.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;max-width:900px;margin:0 auto}
.dl .card{display:flex;flex-direction:column;gap:12px;padding:30px}
.dl .card p{flex:1}
.dl .meta{font-size:13px;color:var(--muted)}

.log{padding:26px;max-width:800px;margin:0 auto}
.log h3{font-family:Silkscreen,monospace;color:var(--navy);margin-bottom:10px}
.log pre{white-space:pre-wrap;font:15px/1.6 system-ui,sans-serif;color:var(--ink)}

footer{text-align:center;padding:40px 0 50px;font-size:13px;color:#1c2335cc}
footer .brand{justify-content:center;margin-bottom:12px;font-size:22px}

@media(max-width:820px){
  .feature,.feature.rev{grid-template-columns:1fr}
  .feature.rev .txt{order:0}
}
@media(max-width:700px){.navlinks,.nav-dl{display:none}}
@media(max-width:420px){.lang button{padding:7px 8px}.brand{font-size:22px}}
</style>

<div class="orb a"></div><div class="orb b"></div>

<header class="wrap">

  <section id="features">
    <h2 class="pix center" data-i18n="features_title"></h2>
    <p class="lead center" data-i18n="features_lead"></p>

    <div class="feature">
      <div class="txt">
        <h3 data-i18n="f1_t"></h3>

    </div>

    <div class="feature rev">
      <div class="txt">
        <h3 data-i18n="f2_t"></h3>
        <p data-i18n="f2_p"></p>
      </div>
      <img class="shot" data-shot="home" data-i18n-alt="alt_version" alt="" width="1180" height="720" loading="lazy">
    </div>

    <div class="feature">
      <div class="txt">
        <h3 data-i18n="f3_t"></h3>
        <p data-i18n="f3_p"></p>
        <ul><li data-i18n="experimental"></li></ul>
      </div>
      <img class="shot" data-shot="textures" data-i18n-alt="alt_textures" alt="" width="1180" height="720" loading="lazy">
    </div>

    <div class="grid" style="margin-top:32px">
      <div class="card glass"><div class="ico">🎮</div><h3 data-i18n="c1_t"></h3><p data-i18n="c1_p"></p></div>
      <div class="card glass"><div class="ico">🔐</div><h3 data-i18n="c2_t"></h3><p data-i18n="c2_p"></p></div>
      <div class="card glass"><div class="ico">🪶</div><h3 data-i18n="c3_t"></h3><p data-i18n="c3_p"></p></div>
      <div class="card glass"><div class="ico">🌍</div><h3 data-i18n="c4_t"></h3><p data-i18n="c4_p"></p></div>
    </div>
  </section>

  <section id="download">
    <h2 class="pix center" data-i18n="dl_title"></h2>
    <p class="lead center" data-i18n="dl_lead"></p>
    <div class="dl">
      <div class="card glass">
        <h3 data-i18n="inst_t"></h3>
        <p data-i18n="inst_p"></p>
        <div class="meta" id="meta-setup">Misty-Setup · Windows 10/11</div>
        <a class="btn primary" href="/download/setup" data-i18n="dl_setup"></a>
      </div>
      <div class="card glass">
        <h3 data-i18n="port_t"></h3>
        <p data-i18n="port_p"></p>
        <div class="meta" id="meta-portable">Misty · .zip</div>
        <a class="btn ghost" href="/download/portable" data-i18n="dl_portable"></a>
      </div>
    </div>
  </section>

  <section id="changelog">
    <h2 class="pix center" data-i18n="news_title"></h2>
    <div class="log glass">
      <h3 id="log-title"></h3>
      <pre id="log-body"></pre>
    </div>
  </section>

</div>
</main>

<footer class="wrap">
  <a class="brand pix" href="#"><img src="/assets/icone.png" alt="" width="32" height="32">Misty</a>
  <p data-i18n="footer"></p>
</footer>

const LANGS = Object.keys(T);
let lang = "fr", rel = null, failed = false;

function detect() {
  try { const s = localStorage.getItem("misty-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  const n = (navigator.language || "en").slice(0, 2).toLowerCase();
  return LANGS.includes(n) ? n : "en";
}

const fmtSize = b => b ? (b / 1048576).toFixed(1).replace(".", T[lang].locale === "en-US" ? "." : ",") + " " + T[lang].mb : "";

function renderDynamic() {
  const t = T[lang], $ = id => document.getElementById(id);
  if (rel) {
    const date = new Date(rel.date).toLocaleDateString(t.locale, {day:"numeric", month:"long", year:"numeric"});
    $("ver").textContent = rel.version;
    $("size-setup").textContent = `v${rel.version} · ${fmtSize(rel.setupSize)} · Windows 10/11`;
    $("size-portable").textContent = `v${rel.version} · ${fmtSize(rel.portableSize)} · .zip`;
    $("meta-setup").textContent = `${t.version} ${rel.version} · ${fmtSize(rel.setupSize)}`;
    $("meta-portable").textContent = `${t.version} ${rel.version} · ${fmtSize(rel.portableSize)}`;
    $("log-title").textContent = `${t.version} ${rel.version} · ${date}`;
    $("log-body").textContent = (rel.notes || "").trim() || t.notes_default;
  } else if (failed) {
    $("ver").textContent = t.latest_fallback;
    $("log-title").textContent = t.unavailable;
  } else {
    $("log-title").textContent = t.loading;
  }
}

function setLang(l) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
  const dir = l === "fr" ? "fr" : "en"; // l'application n'existe qu'en FR/EN : ES/RU/IT utilisent les captures anglaises
  document.querySelectorAll("[data-shot]").forEach(el => {
    const src = `/assets/screens/${dir}/${el.dataset.shot}.png`;
    if (el.getAttribute("src") !== src) el.src = src;
  });
  document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  try { localStorage.setItem("misty-lang", l); } catch (e) {}
  renderDynamic();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
setLang(detect());

fetch("/api/latest").then(r => r.json()).then(d => {
  if (d.error) throw 0;
  rel = d; renderDynamic();
}).catch(() => { failed = true; renderDynamic(); });
</script>
