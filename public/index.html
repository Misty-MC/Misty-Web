<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misty – Launcher Minecraft</title>
<meta name="description" content="Misty, un launcher Minecraft léger écrit en Rust : profils, mods Modrinth et CurseForge, modpacks, tous les mod loaders.">
<meta name="theme-color" content="#1c2335">
<link rel="icon" href="/assets/icone.png">
<style>
@font-face{font-family:Silkscreen;src:url(/assets/Silkscreen-Regular.ttf);font-weight:400;font-display:swap}
@font-face{font-family:Silkscreen;src:url(/assets/Silkscreen-Bold.ttf);font-weight:700;font-display:swap}
:root{
  --navy:#1c2335;--navy-2:#273250;--navy-3:#323f60;--ink:#1c2335;--muted:#4a5874;
  --mist:#eef4fc;--sky:#bad6f7;--sky-2:#95b9e4;--steel:#5b7fb0;
  --green:#25d46c;--green-d:#139a4c;--blue:#2f80ed;
  --glass:rgba(255,255,255,.5);--glass-strong:rgba(255,255,255,.78);--edge:rgba(255,255,255,.7);
  --shadow:0 12px 40px rgba(28,35,53,.18);--shadow-lg:0 40px 90px -20px rgba(28,35,53,.45);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#1c2335 #ffffff40;scroll-padding-top:96px}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;
  background:var(--mist);overflow-x:hidden;line-height:1.6;-webkit-font-smoothing:antialiased;
}
img{max-width:100%}
a{color:inherit}
::selection{background:#1c2335;color:#fff;text-shadow:none}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:#dbe7f6}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2a3550,#1c2335);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#3a4a70,#273250);background-clip:padding-box;border:3px solid transparent}

.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.pix{font-family:Silkscreen,monospace;letter-spacing:.02em}
.glass{
  background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:var(--shadow);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;font-family:Silkscreen,monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--navy);padding:7px 14px;border-radius:10px;background:#ffffffa6;border:1px solid var(--edge);
}
.dot{width:8px;height:8px;border-radius:2px;background:var(--green);box-shadow:0 0 0 3px #25d46c33,0 0 10px var(--green);flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

/* ---------- Boutons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;font-size:16px;line-height:1.25;
  padding:15px 26px;border-radius:14px;cursor:pointer;border:0;position:relative;
  transition:transform .15s,box-shadow .15s,background .15s,filter .15s;
}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.8}
.btn svg{width:22px;height:22px;flex:none}
.btn.play{
  background:linear-gradient(180deg,#3ee584,var(--green));color:#0b2a17;
  box-shadow:0 5px 0 var(--green-d),0 14px 30px -6px #25d46c88;
}
.btn.play:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--green-d),0 20px 36px -6px #25d46c99;filter:brightness(1.04)}
.btn.play:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d),0 8px 18px -6px #25d46c88}
.btn.dark{background:var(--navy);color:#fff;box-shadow:0 5px 0 #0d1220,0 14px 30px -8px #1c233588}
.btn.dark:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0d1220,0 18px 34px -8px #1c233599}
.btn.dark:active{transform:translateY(4px);box-shadow:0 1px 0 #0d1220}
.btn.ghost{background:var(--glass-strong);color:var(--navy);border:1px solid var(--edge);box-shadow:0 5px 0 #c3d4ea}
.btn.ghost:hover{transform:translateY(-2px);background:#fff;box-shadow:0 7px 0 #c3d4ea}
.btn.ghost:active{transform:translateY(4px);box-shadow:0 1px 0 #c3d4ea}
.btn.sm{padding:10px 18px;font-size:14px;border-radius:12px}
.btn.sm svg{width:18px;height:18px}

/* ---------- Navigation ---------- */
header{position:sticky;top:0;z-index:50;padding:14px 0}
nav{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 16px;
  border-radius:18px;transition:box-shadow .3s,background .3s;
}
header.scrolled nav{background:rgba(255,255,255,.72);box-shadow:0 10px 40px rgba(28,35,53,.16)}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--navy);text-decoration:none}
.brand img{width:34px;height:34px;image-rendering:pixelated}
.navlinks{display:flex;gap:2px}
.navlinks a{color:var(--navy);text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;transition:background .2s}
.navlinks a:hover{background:#ffffffb3}
.navright{display:flex;align-items:center;gap:8px}

.langdd{position:relative}
.langdd>button{
  display:flex;align-items:center;gap:6px;font-family:Silkscreen,monospace;font-size:12px;color:var(--navy);
  background:#ffffff99;border:1px solid var(--edge);border-radius:12px;padding:9px 12px;cursor:pointer;
}
.langdd>button:hover{background:#fff}
.langdd>button svg{width:16px;height:16px}
.langdd .menu{
  position:absolute;right:0;top:calc(100% + 8px);min-width:170px;padding:6px;border-radius:14px;
  background:#fff;box-shadow:0 20px 50px rgba(28,35,53,.25);border:1px solid #e3ecf8;
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s;
}
.langdd.open .menu{opacity:1;visibility:visible;transform:none}
.menu button{
  display:flex;justify-content:space-between;width:100%;gap:16px;font:600 14px system-ui,sans-serif;color:var(--navy);
  background:none;border:0;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;
}
.menu button span{font-family:Silkscreen,monospace;font-size:11px;opacity:.5}
.menu button:hover{background:var(--mist)}
.menu button[aria-pressed="true"]{background:var(--navy);color:#fff}
.menu button[aria-pressed="true"] span{opacity:.7}

/* ---------- Hero ---------- */
.hero-bg{
  position:absolute;inset:0 0 auto 0;height:min(1250px,150vh);z-index:-1;overflow:hidden;
  background:
    radial-gradient(900px 500px at 15% 10%,#ffffffcc,transparent 60%),
    radial-gradient(800px 600px at 90% 40%,#5b7fb066,transparent 65%),
    linear-gradient(180deg,#c7ddf7 0%,#a9c6ea 45%,var(--mist) 100%);
}
.cube{position:absolute;border-radius:4px;background:#ffffff80;border:1px solid #ffffffb3;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(8deg)}}
.hero{text-align:center;padding:clamp(40px,7vw,80px) 0 0;position:relative}
.hero h1{
  font-size:clamp(64px,13vw,150px);line-height:.95;color:#fff;font-weight:700;margin-top:22px;
  text-shadow:
    .035em 0 var(--navy-2),-.035em 0 var(--navy-2),0 .035em var(--navy-2),0 -.035em var(--navy-2),
    .035em .035em var(--navy-2),-.035em -.035em var(--navy-2),.035em -.035em var(--navy-2),-.035em .035em var(--navy-2),
    0 .09em 0 #5b7fb0,.035em .09em 0 #5b7fb0,-.035em .09em 0 #5b7fb0,0 .16em 30px #1c233544;
}
.hero p.sub{max-width:640px;margin:26px auto 0;font-size:clamp(17px,2vw,21px);color:#33405b}
.cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.trust{display:flex;gap:8px 22px;justify-content:center;flex-wrap:wrap;margin-top:26px;font-size:14px;color:var(--muted);font-weight:500}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust svg{width:16px;height:16px;color:var(--green-d)}

.stage{position:relative;margin:clamp(48px,7vw,80px) auto 0;max-width:1100px;perspective:1600px}
.stage::before{
  content:"";position:absolute;inset:8% 6% -6%;border-radius:40px;z-index:-1;
  background:radial-gradient(closest-side,#2f80ed66,#25d46c22,transparent);filter:blur(40px);
}
.window{
  border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 1px #ffffffb3;background:#d5e5f8;
  transform:rotateX(var(--tilt,14deg)) scale(var(--sc,.96));transform-origin:50% 0;transition:transform .1s linear;
}
.window img{display:block;width:100%;height:auto}
.chip{
  position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;
  color:var(--navy);background:#ffffffd9;border:1px solid #fff;box-shadow:0 18px 40px -10px #1c233566;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:float 7s ease-in-out infinite;white-space:nowrap;
}
.chip small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.chip .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.chip .ic svg{width:20px;height:20px}
.chip.c1{left:-3%;top:28%}
.chip.c2{right:-3%;top:58%;animation-delay:-3s}
.chip.c1 .ic{background:#e6f9ee;color:var(--green-d)}
.chip.c2 .ic{background:#e5efff;color:var(--blue)}

/* ---------- Bandeau loaders ---------- */
.marquee-sec{padding:clamp(56px,8vw,96px) 0 20px;text-align:center}
.marquee-sec p{font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:14px;width:max-content;animation:scroll 32s linear infinite}
.marquee:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(calc(-50% - 7px))}}
.tag{
  font-family:Silkscreen,monospace;font-size:15px;color:var(--navy);padding:14px 24px;border-radius:14px;
  background:#fff;border:1px solid #dfe9f6;box-shadow:0 3px 0 #d3e1f2;display:flex;align-items:center;gap:10px;white-space:nowrap;
}
.tag i{width:10px;height:10px;border-radius:2px;background:var(--c,#5b7fb0)}

/* ---------- Sections ---------- */
section{padding:clamp(64px,9vw,112px) 0}
.head{text-align:center;max-width:680px;margin:0 auto clamp(36px,5vw,56px)}
.head h2{font-family:Silkscreen,monospace;font-size:clamp(26px,4.4vw,44px);line-height:1.1;color:var(--navy);margin:16px 0 14px}
.head p{color:var(--muted);font-size:18px}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{padding:26px 22px;text-align:center}
.stat b{display:block;font-family:Silkscreen,monospace;font-size:clamp(34px,4.5vw,48px);line-height:1;color:var(--navy)}
.stat span{display:block;margin-top:10px;color:var(--muted);font-size:14px;font-weight:600}

/* Vitrine à onglets */
.showcase{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:clamp(24px,4vw,48px);align-items:center}
.tabs{display:flex;flex-direction:column;gap:12px}
.tab{
  text-align:left;background:transparent;border:1px solid transparent;border-radius:18px;padding:20px 22px;cursor:pointer;
  font:inherit;color:inherit;position:relative;overflow:hidden;transition:background .25s,border-color .25s,box-shadow .25s;
}
.tab:hover{background:#ffffff80}
.tab.on{background:#fff;border-color:#e1eaf6;box-shadow:0 14px 40px -12px #1c233533}
.tab h3{display:flex;align-items:center;gap:12px;font-family:Silkscreen,monospace;font-size:17px;color:var(--navy)}
.tab h3 .n{font-size:11px;color:#fff;background:var(--navy);border-radius:7px;padding:3px 7px;opacity:.35;transition:opacity .25s}
.tab.on h3 .n{opacity:1}
.tab .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.tab.on .body{grid-template-rows:1fr}
.tab .body>div{overflow:hidden}
.tab p{color:var(--muted);font-size:15.5px;padding-top:10px}
.tab ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tab li{font-family:Silkscreen,monospace;font-size:10.5px;padding:5px 10px;border-radius:8px;background:var(--mist);color:var(--navy);border:1px solid #dce7f5}
.tab .bar{position:absolute;left:22px;right:22px;bottom:0;height:3px;border-radius:3px;background:#e8eef7;overflow:hidden;opacity:0}
.tab.on .bar{opacity:1}
.tab .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green))}
.tab.on .bar i{animation:prog var(--dur,7s) linear forwards}
.showcase.paused .tab.on .bar i{animation-play-state:paused}
@keyframes prog{to{width:100%}}
.screens{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 1px #ffffffb3;aspect-ratio:1180/720;background:#d5e5f8}
.screens img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity .5s,transform .7s}
.screens img.on{opacity:1;transform:none}

/* Bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:clamp(40px,6vw,64px)}
.card{padding:26px;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 50px -12px #1c233540}
.card .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;color:#fff;background:var(--navy);box-shadow:0 4px 0 #0d1220}
.card .ico svg{width:22px;height:22px}
.card h3{font-family:Silkscreen,monospace;font-size:15px;color:var(--navy);margin-bottom:6px}
.card p{font-size:15px;color:var(--muted)}
.card.wide{grid-column:span 2;background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;border-color:#ffffff22}
.card.wide h3{color:#fff;font-size:18px}
.card.wide p{color:#c5d3ea}
.card.wide .ico{background:var(--green);color:#0b2a17;box-shadow:0 4px 0 var(--green-d)}
.card.wide::after{
  content:"";position:absolute;right:-20px;top:-20px;width:160px;height:160px;opacity:.08;
  background:conic-gradient(from 90deg at 50% 50%,#fff 0 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/40px 40px;
}

/* Étapes */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{padding:30px 26px;position:relative}
.step .num{
  font-family:Silkscreen,monospace;font-size:13px;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid #dce7f5;box-shadow:0 4px 0 #d3e1f2;margin-bottom:18px;
}
.step:last-child .num{background:var(--green);border-color:var(--green);color:#0b2a17;box-shadow:0 4px 0 var(--green-d)}
.step h3{font-family:Silkscreen,monospace;font-size:17px;color:var(--navy);margin-bottom:8px}
.step p{color:var(--muted);font-size:15.5px}
.step:not(:last-child)::after{
  content:"";position:absolute;top:50px;right:-14px;width:12px;height:12px;border-top:3px solid #9fb6d6;border-right:3px solid #9fb6d6;
  transform:rotate(45deg);z-index:1;
}

/* Téléchargement */
.dlpanel{
  position:relative;overflow:hidden;border-radius:30px;padding:clamp(28px,5vw,56px);color:#fff;
  background:
    radial-gradient(600px 300px at 0% 0%,#2f80ed55,transparent 70%),
    radial-gradient(500px 300px at 100% 100%,#25d46c33,transparent 70%),
    linear-gradient(135deg,#1c2335,#2a3655);
  box-shadow:var(--shadow-lg);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(24px,4vw,48px);align-items:center;
}
.dlpanel .eyebrow{background:#ffffff14;border-color:#ffffff26;color:#fff}
.dlpanel h2{font-family:Silkscreen,monospace;font-size:clamp(28px,4.6vw,48px);line-height:1.05;margin:18px 0 14px}
.dlpanel>div>p{color:#c5d3ea;font-size:17px}
.dlpanel .ver{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:14px;color:#c5d3ea}
.dlpanel .ver b{color:#fff;font-family:Silkscreen,monospace}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{
  display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:20px;background:#ffffff0d;border:1px solid #ffffff1f;
  transition:background .2s,border-color .2s,transform .2s;
}
.opt:hover{background:#ffffff14;border-color:#ffffff33;transform:translateY(-3px)}
.opt.rec{background:#ffffff17;border-color:#25d46c66}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt h3{font-family:Silkscreen,monospace;font-size:18px}
.opt .pill{font-family:Silkscreen,monospace;font-size:9.5px;letter-spacing:.06em;padding:4px 8px;border-radius:7px;background:var(--green);color:#0b2a17}
.opt p{color:#c5d3ea;font-size:14.5px;flex:1}
.opt p b{color:#fff}
.opt .meta{font-size:12.5px;color:#8fa3c4;font-family:ui-monospace,Consolas,monospace}
.opt .btn{justify-content:center;margin-top:6px}
.opt .btn.ghost{background:#ffffff14;color:#fff;border-color:#ffffff33;box-shadow:0 5px 0 #0d1220}
.opt .btn.ghost:hover{background:#ffffff26}
.opt .btn.ghost:active{box-shadow:0 1px 0 #0d1220}

/* Nouveautés */
.log{max-width:820px;margin:0 auto;padding:0;overflow:hidden}
.log .lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 26px;border-bottom:1px solid #ffffffb3;background:#ffffff66}
.log h3{font-family:Silkscreen,monospace;color:var(--navy);font-size:16px;display:flex;align-items:center;gap:10px}
.log .lbody{padding:22px 26px 26px;color:var(--ink);font-size:15.5px;max-height:440px;overflow:auto}
.log .lbody h4{font-family:Silkscreen,monospace;font-size:14px;color:var(--navy);margin:16px 0 6px}
.log .lbody h4:first-child{margin-top:0}
.log .lbody ul{padding-left:20px;margin:6px 0}
.log .lbody li{margin:4px 0}
.log .lbody li::marker{color:var(--steel)}
.log .lbody p{margin:6px 0}
.log .lbody code{font:13px ui-monospace,Consolas,monospace;background:#ffffffb3;padding:1px 6px;border-radius:6px}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--navy);text-decoration:none}
.link:hover{text-decoration:underline}
.link svg{width:16px;height:16px}

/* FAQ */
.faq{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.faq details{border-radius:18px;background:#ffffffa6;border:1px solid var(--edge);transition:background .2s,box-shadow .2s}
.faq details[open]{background:#fff;box-shadow:0 14px 40px -14px #1c233533}
.faq summary{
  list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:20px 24px;font-weight:700;font-size:16.5px;color:var(--navy);
}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{
  width:30px;height:30px;border-radius:9px;background:var(--mist);flex:none;position:relative;transition:transform .25s,background .25s;
}
.faq summary i::before,.faq summary i::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2.5px;background:var(--navy);transform:translate(-50%,-50%)}
.faq summary i::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .25s}
.faq details[open] summary i{background:var(--navy)}
.faq details[open] summary i::before,.faq details[open] summary i::after{background:#fff}
.faq details[open] summary i::after{transform:translate(-50%,-50%) rotate(0)}
.faq details p{padding:0 24px 22px;color:var(--muted);font-size:15.5px}

/* Bandeau CTA */
.ctaband{
  position:relative;overflow:hidden;text-align:center;border-radius:30px;padding:clamp(40px,7vw,80px) 24px;
  background:linear-gradient(180deg,#d6e7fb,#a9c6ea);border:1px solid #fff;box-shadow:var(--shadow);
}
.ctaband h2{font-family:Silkscreen,monospace;font-size:clamp(30px,5.5vw,60px);line-height:1.05;color:var(--navy)}
.ctaband p{color:#33405b;font-size:18px;max-width:540px;margin:16px auto 30px}
.ctaband .ground{
  position:absolute;left:0;right:0;bottom:0;height:22px;
  background:
    linear-gradient(90deg,#7ec850 0 25%,#6ab83f 0 50%,#86d158 0 75%,#5da935 0) 0 0/64px 8px repeat-x,
    linear-gradient(90deg,#8a5a3b 0 25%,#7a4e33 0 50%,#946342 0 75%,#6d452c 0) 0 8px/48px 14px repeat-x;

    q1:"Misty è gratuito?", a1:"Sì, Misty è completamente gratuito.",
    q2:"Servono i diritti di amministratore?", a2:"No. L'installer si installa nel tuo profilo utente e la versione portatile non si installa affatto.",
    q3:"Posso giocare senza account Microsoft?", a3:"Misty supporta l'accesso con Microsoft e anche gli account offline: scegli tu.",
    q4:"Da dove arrivano le mod?", a4:"Da Modrinth e CurseForge. Le dipendenze vengono installate automaticamente e i modpack si importano con un clic.",
    q5:"Quali mod loader sono supportati?", a5:"Forge, NeoForge, Fabric, Quilt, OptiFine e LiteLoader, su tutte le versioni di Minecraft: release, snapshot, beta e alpha.",
    cta_t:"Pronto a giocare?", cta_p:"Scarica Misty e inizia la tua prossima partita in pochi clic.", cta_b:"Scarica Misty",
    ft_tag:"Il launcher di Minecraft leggero, veloce ed elegante. Scritto in Rust, pensato per i giocatori.",
    ft_product:"Prodotto", ft_all:"Tutte le versioni", ft_lang:"Lingua", ft_top:"Torna su",
    footer:"Misty non è affiliato a Mojang Studios né a Microsoft. Minecraft è un marchio di Mojang AB.", mb:"MB"
  }
};

const LANGS = Object.keys(T);
let lang = "fr", rel = null, failed = false;
const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);

function detect() {
  try { const s = localStorage.getItem("misty-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  const n = (navigator.language || "en").slice(0, 2).toLowerCase();
  return LANGS.includes(n) ? n : "en";
}

const fmtSize = b => b ? (b / 1048576).toFixed(1).replace(".", T[lang].locale === "en-US" ? "." : ",") + " " + T[lang].mb : "";

// Mini-rendu Markdown (titres, listes, gras, code) — le texte est échappé d'abord.
function md(src) {
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let out = "", inList = false;
  for (const raw of src.split(/\r?\n/)) {
    const line = raw.trim();
    const li = line.match(/^[-*+]\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (!line) continue;
    const h = line.match(/^#{1,6}\s+(.*)/);
    out += h ? `<h4>${inline(h[1])}</h4>` : `<p>${inline(line)}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}

function renderDynamic() {
  const t = T[lang];
  if (rel) {
    const date = new Date(rel.date).toLocaleDateString(t.locale, {day:"numeric", month:"long", year:"numeric"});
    $$(".ver-txt").forEach(el => el.textContent = rel.version);
    $("size-setup").textContent = `${rel.version} · ${fmtSize(rel.setupSize)} · Windows 10/11`;
    $("size-portable").textContent = `${rel.version} · ${fmtSize(rel.portableSize)} · .zip`;
    $("meta-setup").textContent = `${t.version} ${rel.version} · ${fmtSize(rel.setupSize)} · .exe`;
    $("meta-portable").textContent = `${t.version} ${rel.version} · ${fmtSize(rel.portableSize)} · .zip`;
    $("log-title").textContent = `${t.version} ${rel.version} · ${date}`;
    const notes = (rel.notes || "").trim();
    $("log-body").innerHTML = notes ? md(notes) : `<p>${t.notes_default}</p>`;
  } else if (failed) {
    $$(".ver-txt").forEach(el => el.textContent = t.latest_fallback);
    $("log-title").textContent = t.unavailable;
    $("log-body").innerHTML = `<p>${t.notes_default}</p>`;
  } else {
    $("log-title").textContent = t.loading;
  }
}

function setLang(l) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.title = t.title;
  $$("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n] ?? ""; });
  const dir = l === "fr" ? "fr" : "en"; // l'application n'existe qu'en FR/EN : ES/RU/IT utilisent les captures anglaises
  $$("[data-shot]").forEach(el => {
    const src = `/assets/screens/${dir}/${el.dataset.shot}.png`;
    if (el.getAttribute("src") !== src) el.src = src;
  });
  $$("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  $("lang-cur").textContent = l.toUpperCase();
  try { localStorage.setItem("misty-lang", l); } catch (e) {}
  renderDynamic();
}

// Menu de langue
const dd = $("langdd"), ddBtn = dd.querySelector("button");
const closeDd = () => { dd.classList.remove("open"); ddBtn.setAttribute("aria-expanded", "false"); };
ddBtn.addEventListener("click", e => {
  e.stopPropagation();
  const open = dd.classList.toggle("open");
  ddBtn.setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", closeDd);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDd(); });
$$("[data-lang]").forEach(b => b.addEventListener("click", () => { setLang(b.dataset.lang); closeDd(); }));

setLang(detect());
$("year").textContent = new Date().getFullYear();

fetch("/api/latest").then(r => r.json()).then(d => {
  if (d.error) throw 0;
  rel = d; renderDynamic();
}).catch(() => { failed = true; renderDynamic(); });

// Bandeau défilant : on duplique le contenu pour une boucle continue
const track = $("track");
track.innerHTML += track.innerHTML;

// Nav compacte + inclinaison de la capture au défilement
const header = document.querySelector("header"), stage = $("stage"), win = stage.querySelector(".window");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function onScroll() {
  header.classList.toggle("scrolled", scrollY > 10);
  if (reduce) return;
  const r = stage.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, 1 - (r.top - innerHeight * .25) / (innerHeight * .6)));
  win.style.setProperty("--tilt", (14 * (1 - p)).toFixed(2) + "deg");
  win.style.setProperty("--sc", (.96 + .04 * p).toFixed(3));
}
addEventListener("scroll", onScroll, { passive: true });
onScroll();

// Vitrine à onglets (défilement automatique, pause au survol)
const show = $("showcase"), tabs = [...show.querySelectorAll(".tab")], panes = show.querySelectorAll(".screens img");
let cur = 0;
function selectTab(i) {
  cur = i;
  tabs.forEach((t, k) => { t.classList.toggle("on", k === i); t.setAttribute("aria-selected", String(k === i)); });
  panes.forEach(p => p.classList.toggle("on", p.dataset.pane === tabs[i].dataset.tab));
  const bar = tabs[i].querySelector(".bar i");
  bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = "";
}
// La barre de progression pilote le passage à l'onglet suivant (elle se met en pause au survol)
tabs.forEach((t, i) => {
  t.addEventListener("click", () => selectTab(i));
  t.querySelector(".bar i").addEventListener("animationend", () => { if (cur === i) selectTab((i + 1) % tabs.length); });
});
show.addEventListener("mouseenter", () => show.classList.add("paused"));
show.addEventListener("mouseleave", () => show.classList.remove("paused"));
selectTab(0);

// Apparition au défilement
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  $$(".reveal").forEach(el => io.observe(el));
} else {
  $$(".reveal").forEach(el => el.classList.add("in"));
}
</script>
</body>
</html>
