# Déploie le site sur Coolify à chaque push sur main, et affiche le résultat dans
# le panneau « Deployments » du dépôt (environnement « production »).
#
# Réglages (Settings → Secrets and variables → Actions), en secret ou en variable :
#   - COOLIFY_TOKEN    (obligatoire, en secret) : token API Coolify avec la permission « deploy »
#   - COOLIFY_URL      (facultatif) : adresse de l'instance Coolify, https://panel.enderr.win par défaut
#   - COOLIFY_APP_UUID (facultatif) : UUID de l'application dans Coolify, celle du site par défaut
# Pensez à désactiver l'« Auto Deploy » dans Coolify pour ne pas déployer deux fois.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://misty-launcher.online
    steps:
      - name: Lancer le déploiement et attendre la fin
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL || secrets.COOLIFY_URL || 'https://panel.enderr.win' }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID || secrets.COOLIFY_APP_UUID || '68wabiwd7glmjqiizbwfntzo' }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::Le secret COOLIFY_TOKEN n'est pas défini (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          api="${COOLIFY_URL%/}/api/v1"
          auth="Authorization: Bearer ${COOLIFY_TOKEN}"

          # Les versions récentes de Coolify n'acceptent que POST pour lancer un déploiement.
          res=$(curl -fsS -X POST -H "$auth" "$api/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          echo "$res"
          id=$(echo "$res" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$id" ]; then
            echo "Coolify n'a pas renvoyé d'identifiant de déploiement."
            exit 1
          fi

          # Suivi du déploiement (jusqu'à 25 minutes).
          for _ in $(seq 1 150); do
            status=$(curl -fsS -H "$auth" "$api/deployments/$id" | jq -r '.status')
            echo "Statut : $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*|error) exit 1 ;;
            esac
            sleep 10
          done
          echo "Le déploiement n'a pas fini à temps."
          exit 1
