q1 = "Misty est-il gratuit ?"
a1 = "Oui, Misty est entièrement gratuit."
q2 = "Faut-il des droits administrateur ?"
a2 = "Non. L'installeur s'installe dans votre profil utilisateur, et la version portable ne s'installe pas du tout."
q3 = "Puis-je jouer sans compte Microsoft ?"
a3 = "Misty gère la connexion Microsoft ainsi que les comptes hors-ligne : c'est vous qui choisissez."
q4 = "D'où viennent les mods ?"
a4 = "De Modrinth et CurseForge. Les dépendances sont installées automatiquement et les modpacks s'importent en un clic."
q5 = "Quels mod loaders sont pris en charge ?"
a5 = "Forge, NeoForge, Fabric, OptiFine et LiteLoader. Misty ne propose que ceux qui existent pour la version choisie : par exemple NeoForge à partir de la 1.20.1, LiteLoader jusqu'à la 1.12.2."

