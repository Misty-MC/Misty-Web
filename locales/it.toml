faq_title = "Domande frequenti"
q1 = "Misty è gratuito?"
a1 = "Sì, Misty è completamente gratuito."
q2 = "Servono i diritti di amministratore?"
a2 = "No. L'installer si installa nel tuo profilo utente e la versione portatile non si installa affatto."
q3 = "Posso giocare senza account Microsoft?"
a3 = "Misty supporta l'accesso con Microsoft e anche gli account offline: scegli tu."
q4 = "Da dove arrivano le mod?"
a4 = "Da Modrinth e CurseForge. Le dipendenze vengono installate automaticamente e i modpack si importano con un clic."
q5 = "Quali mod loader sono supportati?"
a5 = "Forge, NeoForge, Fabric, OptiFine e LiteLoader. Misty propone solo quelli disponibili per la versione scelta: ad esempio NeoForge dalla 1.20.1, LiteLoader fino alla 1.12.2."

