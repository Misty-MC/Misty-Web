faq_label = "FAQ"
faq_title = "Frequently asked questions"
q1 = "Is Misty free?"
a1 = "Yes, Misty is completely free."
q2 = "Do I need admin rights?"
a2 = "No. The installer installs into your user profile, and the portable version doesn't install at all."
q3 = "Can I play without a Microsoft account?"
a3 = "Misty supports Microsoft sign-in as well as offline accounts: it's your choice."
q4 = "Where do mods come from?"
a4 = "From Modrinth and CurseForge. Dependencies are installed automatically and modpacks are imported in one click."
q5 = "Which mod loaders are supported?"
a5 = "Forge, NeoForge, Fabric, OptiFine and LiteLoader. Misty only offers the ones that exist for the chosen version: for example NeoForge from 1.20.1, LiteLoader up to 1.12.2."

