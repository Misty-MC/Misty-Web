faq_label = "FAQ"
faq_title = "Preguntas frecuentes"
q1 = "¿Misty es gratis?"
a1 = "Sí, Misty es completamente gratis."
q2 = "¿Necesito permisos de administrador?"
a2 = "No. El instalador se instala en tu perfil de usuario y la versión portable no se instala en absoluto."
q3 = "¿Puedo jugar sin cuenta de Microsoft?"
a3 = "Misty admite el inicio de sesión con Microsoft y también cuentas sin conexión: tú eliges."
q4 = "¿De dónde vienen los mods?"
a4 = "De Modrinth y CurseForge. Las dependencias se instalan automáticamente y los modpacks se importan con un clic."
q5 = "¿Qué mod loaders son compatibles?"
a5 = "Forge, NeoForge, Fabric, OptiFine y LiteLoader. Misty solo propone los que existen para la versión elegida: por ejemplo NeoForge desde la 1.20.1, LiteLoader hasta la 1.12.2."

